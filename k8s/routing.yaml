# Bespoke routing for the picker admin tool. Names are explicit (this overlay
# does not use namePrefix) so the Service/Middleware refs are unambiguous.
# Keycloak SSO gates both routes.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: picker-redirect-root
spec:
  redirectRegex:
    regex: ^https?://skirmshop\.e-dani\.com(:[0-9]+)?/picker$
    replacement: https://skirmshop.e-dani.com/picker/shopify/purchase-orders
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: picker-strip
spec:
  stripPrefix:
    prefixes:
      - /picker
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: skirmshop-picker
  annotations:
    external-dns.alpha.kubernetes.io/hostname: skirmshop.e-dani.com
    external-dns.alpha.kubernetes.io/target: "57.129.17.172"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    # Shopify webhook deliveries can't follow the Keycloak redirect; the
    # handler authenticates them itself via X-Shopify-Hmac-Sha256
    # (SHOPIFY_API_SECRET), so this path must bypass sso-chain.
    - match: Host(`skirmshop.e-dani.com`) && PathPrefix(`/picker/webhooks/`)
      kind: Rule
      priority: 400
      middlewares:
        - { name: picker-strip }
      services:
        - { name: skirmshop-picker, port: 80 }
    - match: Host(`skirmshop.e-dani.com`) && Path(`/picker`)
      kind: Rule
      priority: 300
      middlewares:
        - { name: sso-chain, namespace: keycloak }
        - { name: picker-redirect-root }
      services:
        - { name: skirmshop-picker, port: 80 }
    - match: Host(`skirmshop.e-dani.com`) && PathPrefix(`/picker`)
      kind: Rule
      priority: 100
      middlewares:
        - { name: sso-chain, namespace: keycloak }
        - { name: picker-strip }
      services:
        - { name: skirmshop-picker, port: 80 }
  tls:
    store: { name: default, namespace: traefik-edge }
