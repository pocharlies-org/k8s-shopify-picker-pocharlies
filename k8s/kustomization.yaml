apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skirmshop

# Internal admin tool (not Shopify-embedded): bespoke routing + Keycloak SSO.
# Uses explicit names (no namePrefix) because routing is hand-written.
resources:
  - https://github.com/pocharlies/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod
  - routing.yaml
  - cronjobs.yaml
  - externalsecret-ga4.yaml
  - externalsecret-brain-feedback.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: picker

images:
  - name: shopify-app
    newName: harbor.e-dani.com/homelab/skirmshop-picker
    digest: sha256:ecfe92d353527db62cb1966e7d26b6ef42f904b2a1e0fdd3b885b6c8cc0d38c1

patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: PORT, value: "3480" }
                  # Override the framework base's generic SCOPES (read_products,write_products):
                  # as a direct env var it shadows the real scopes. Must match this app's
                  # shopify.app.toml access_scopes and k8s/expected-scopes.txt
                  # (guarded by scripts/verify-scopes.sh).
                  - { name: SCOPES, value: "read_products,read_inventory,read_orders,read_reports,read_customers,read_customer_address,read_customer_email,read_customer_name,read_customer_phone" }
                  - { name: S3_ENDPOINT, value: "http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000" }
                  - { name: S3_BUCKET, value: "skirmshop-drive" }
                  - { name: S3_REGION, value: "us-east-1" }
                  - { name: S3_PREFIX, value: "price-lists" }
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-app, key: AWS_ACCESS_KEY_ID } }
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-app, key: AWS_SECRET_ACCESS_KEY } }
                  - name: BRAIN_API_KEY
                    valueFrom: { secretKeyRef: { name: picker-brain-feedback-secrets, key: BRAIN_API_KEY } }
                envFrom:
                  - secretRef: { name: picker-secrets }
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /metadata/name
        value: skirmshop-picker
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3480
  - target: { version: v1, kind: Service, name: app }
    patch: |-
      - op: replace
        path: /metadata/name
        value: skirmshop-picker
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: app
