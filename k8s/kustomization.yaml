apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skirmshop

# Internal admin tool (not Shopify-embedded): bespoke routing + Keycloak SSO.
# Uses explicit names (no namePrefix) because routing is hand-written.
resources:
  - https://github.com/pocharlies/k8s-shopify-framework-pocharlies.git//base?ref=deploy/prod
  - routing.yaml
  - cronjobs.yaml
  - externalsecret-ga4.yaml
  - externalsecret-brain-feedback.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/instance: picker

images:
  - name: shopify-app
    newName: harbor.e-dani.com/homelab/skirmshop-picker
    # Unified image: Postgres backend + MOQ/pack rounding + retention + GA4
    # composite-itemId matching + real on-order + supplier minimum-order-value
    # flagging + Shopify-only paid/unfulfilled demand not yet in Picqer.
    # Built from skirmshop-picqer@main edf8983. All picker workloads share this image.
    digest: sha256:083914dc6c127540c531082825538efd1973900c2145f857832734fac86e219f

patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - { name: PORT, value: "3480" }
                  # Override the framework base's generic SCOPES (read_products,write_products):
                  # as a direct env var it shadows the real scopes. Must match this app's
                  # shopify.app.toml access_scopes and k8s/expected-scopes.txt
                  # (guarded by scripts/verify-scopes.sh).
                  - { name: SCOPES, value: "read_products,read_inventory,read_orders,read_reports" }
                  - name: BRAIN_API_KEY
                    valueFrom: { secretKeyRef: { name: picker-brain-feedback-secrets, key: BRAIN_API_KEY } }
                  # Shared Postgres run-state/config (picker schema): server.py shares
                  # purchase runs/config/snapshots with the cron jobs instead of
                  # ephemeral pod-local SQLite. Backend auto-selected by DATABASE_URL.
                  - name: DB_USER
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: username } }
                  - name: DB_PASSWORD
                    valueFrom: { secretKeyRef: { name: shared-postgres-app, key: password } }
                  - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop" }
                envFrom:
                  - secretRef: { name: picker-secrets }
            imagePullSecrets:
              - name: harbor-pull
  - target: { group: apps, version: v1, kind: Deployment, name: app }
    patch: |-
      - op: replace
        path: /metadata/name
        value: skirmshop-picker
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3480
  - target: { version: v1, kind: Service, name: app }
    patch: |-
      - op: replace
        path: /metadata/name
        value: skirmshop-picker
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: app }
    patch: |-
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: app
