apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picker-brain-feedback
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: picker-brain-feedback-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        BRAIN_API_KEY: "{{ .dashboard_api_key }}"
  data:
    - secretKey: dashboard_api_key
      remoteRef:
        key: skirmshop-brain/prod/app
        property: dashboard_api_key
