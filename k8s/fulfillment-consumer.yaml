apiVersion: apps/v1
kind: Deployment
metadata:
  name: picker-fulfillment
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: picker-fulfillment}
  template:
    metadata:
      labels: {app: picker-fulfillment}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: harbor-pull}]
      nodeSelector: {kubernetes.io/arch: amd64, role: edge}
      tolerations: [{key: role, operator: Equal, value: edge, effect: NoSchedule}]
      containers:
        - name: consumer
          image: harbor.e-dani.com/homelab/skirmshop-picker@sha256:d4c2abb4adedd02c30a12eaf9afd29cba47ae0435338f7f0a3ff35bc0bbcc117
          command: [python3, fulfillment_consumer.py]
          env:
            - name: SHOPIFY_ACCESS_TOKEN
              valueFrom: {secretKeyRef: {name: picker-secrets, key: SHOPIFY_ACCESS_TOKEN}}
            - name: PICQER_API_KEY
              valueFrom: {secretKeyRef: {name: picker-secrets, key: PICQER_API_KEY}}
            - {name: PICQER_SUBDOMAIN, value: skirmshop}
            - {name: NATS_URL, value: 'nats://labels-nats-cluster:4222'}
            # First sequence after verified removal of both legacy writers (SKIRM-533).
            - {name: FIRST_STREAM_SEQUENCE, value: '82624'}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: shared-postgres-app, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: shared-postgres-app, key: password}}
            - {name: DATABASE_URL, value: 'postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/skirmshop?connect_timeout=10&application_name=picker-fulfillment'}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 192Mi}
