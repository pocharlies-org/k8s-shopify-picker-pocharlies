# GA4 demand-signal creds for the purchase engine, sourced durably from Vault
# (secret/skirmshop/picker). creationPolicy: Merge → adds only the GA4 keys to
# the existing picker-secrets without owning/overwriting its other keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picker-ga4
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: picker-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: GA4_PROPERTY_ID
      remoteRef:
        key: secret/skirmshop/picker
        property: GA4_PROPERTY_ID
    - secretKey: GA4_CREDENTIALS_JSON
      remoteRef:
        key: secret/skirmshop/picker
        property: GA4_CREDENTIALS_JSON
