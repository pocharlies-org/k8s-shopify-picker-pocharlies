# GA4 demand-signal creds for the purchase engine, sourced durably from Vault
# (secret/skirmshop/picker). creationPolicy: Merge → adds only these keys to
# the existing picker-secrets without owning/overwriting its other keys.
# Also carries SHOPIFY_ACCESS_TOKEN (read_products): without it get_shopify_session()
# is None and the GA4 matcher can't load the Shopify catalog (variant GID→SKU), so
# composite itemIds (shopify_<mkt>_<product>_<variant>) only match by title (~18%).
# Reuses the skirmshop store Admin token already in Vault (skirmshop-brain/prod/app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: picker-ga4
  namespace: skirmshop
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: picker-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: GA4_PROPERTY_ID
      remoteRef:
        key: secret/skirmshop/picker
        property: GA4_PROPERTY_ID
    - secretKey: GA4_CREDENTIALS_JSON
      remoteRef:
        key: secret/skirmshop/picker
        property: GA4_CREDENTIALS_JSON
    - secretKey: SHOPIFY_ACCESS_TOKEN
      remoteRef:
        key: skirmshop-brain/prod/app
        property: shopify_access_token
